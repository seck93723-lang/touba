<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestione Livraison Touba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app, sticky road-green header with tabs; delivery cards with colored status stripe; settings + site generator in its own tab */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --fg:#1d2320; --muted:#646c67; --line:#dcd9d1;
  --accent:#d9621b; --accent-ink:#ffffff; --road:#243b34; --soft:#f7e6da;
  --st-pick:#c2410c; --st-go:#1d6fb8; --st-done:#2f7d4f; --warn:#b45309; --err:#b42318;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131816; --surface:#1c2320; --fg:#ecefe9; --muted:#9aa39d; --line:#2e3833;
  --accent:#f07a32; --accent-ink:#1a0e05; --road:#0d1311; --soft:#33261d;
  --st-pick:#f08a4b; --st-go:#5aa7ea; --st-done:#5cc185; --warn:#f0b35a; --err:#f97066; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1c2320; --fg:#ecefe9; --muted:#9aa39d; --line:#2e3833;
  --accent:#f07a32; --accent-ink:#1a0e05; --road:#0d1311; --soft:#33261d;
  --st-pick:#f08a4b; --st-go:#5aa7ea; --st-done:#5cc185; --warn:#f0b35a; --err:#f97066; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--road);color:#f3efe6;padding:12px 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:680px;margin:0 auto}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{color:var(--accent)}
.lang{display:flex;border:1px solid #ffffff40;border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:4px 12px;color:#f3efe6;font-weight:600;font-size:14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav{display:flex;gap:2px;max-width:680px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
nav button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:#cfd6d0;padding:8px 8px 10px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent)}
main{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 96px;display:grid;gap:14px}
h2{font-family:var(--display);font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
h3{font-family:var(--display);font-size:18px;margin:0;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.small{padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:15px}
.sum b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.banner{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.card.pick{--c:var(--st-pick)} .card.go{--c:var(--st-go)} .card.done{--c:var(--st-done)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.price{font-family:var(--display);font-size:22px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.status{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.route{display:grid;grid-template-columns:18px 1fr;gap:3px 8px;font-size:15px}
.route i{font-style:normal;font-weight:700;color:var(--muted);font-size:13px;padding-top:1px}
.route a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;overflow-wrap:anywhere}
.route .sub{color:var(--muted);font-size:14px}
.what{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--bg);border:1px solid var(--line)}
.tag.warn{color:var(--warn);border-color:var(--warn);background:none}
.tag.ok{color:var(--st-done);border-color:var(--st-done);background:none}
.cod{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:14px}
.cod b{font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok,.btn.wa{background:var(--st-done);border-color:var(--st-done);color:#fff}
.btn.danger{color:var(--err);border-color:var(--err);background:none}
.btn.tiny{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.55}
.btn:focus-visible,.chip:focus-visible,nav button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.paid{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;cursor:pointer;border:1px solid;background:none}
.paid.yes{color:var(--st-done);border-color:var(--st-done)}
.paid.no{color:var(--warn);border-color:var(--warn)}
.phone{font-size:14px;color:var(--muted);user-select:all}
form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
fieldset{border:0;margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;gap:12px;min-width:0}
legend{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.04em;padding:0 0 4px}
label{display:grid;gap:4px;font-weight:600;font-size:14px;min-width:0}
label small{font-weight:400;color:var(--muted)}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:11px 12px;font-size:16px;font-weight:400}
select.rsel{width:auto;padding:7px 10px;font-size:15px;max-width:100%}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:460px){.two,.three{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;flex:none}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--road);border-color:var(--road);color:#fff}
.inbox{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.inbox-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inbox-h b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:14px;margin-left:8px;padding:0 6px}
.ibq{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.paste{display:grid;gap:8px;padding:12px;border:1px dashed var(--accent);border-radius:10px}
.paste .btn{justify-self:start}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px;font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;box-shadow:0 6px 18px #0004;cursor:pointer;z-index:6}
.empty{text-align:center;padding:28px 16px;border:2px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:22px;text-transform:uppercase;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:460px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--muted)}
.list{display:grid;gap:10px}
.table{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.trow:first-child{border-top:0}
.trow .n{font-weight:600;overflow-wrap:anywhere}
.trow b{font-family:var(--display);font-size:19px}
@media (max-width:460px){.trow{grid-template-columns:1fr auto}.trow span:nth-child(2){grid-column:1;grid-row:2;color:var(--muted);font-size:14px}.trow b{grid-row:1/3;grid-column:2}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted);text-align:center;margin:0}
.steps{margin:0;padding-left:22px;display:grid;gap:10px}
.steps li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}
.linkbox{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all;color:var(--muted)}
.qr{display:grid;justify-items:center;gap:10px}
.qr svg{width:200px;height:200px;background:#fff;padding:10px;border-radius:10px}
.sitecard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
[hidden]{display:none!important}
.lock{position:fixed;inset:0;z-index:20;background:var(--road);color:#f3efe6;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.lockbox{width:100%;max-width:340px;display:grid;gap:18px;justify-items:center;text-align:center}
.lockbox .lk{font-size:40px;line-height:1}
.lockbox h2{color:#fff;font-size:26px}
.lockbox p{margin:0;color:#cfd6d0;font-size:15px}
.dots{display:flex;gap:16px;height:20px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid #f3efe6;display:block}
.dots i.on{background:#f3efe6}
.dots.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.dots.bad{animation:none}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.keys button{height:76px;border-radius:50%;border:1px solid #ffffff38;background:#ffffff12;color:#fff;font-family:var(--display);font-size:32px;font-weight:600;cursor:pointer}
.keys button:active{background:#ffffff30}
.keys button.fn{font-family:var(--body);font-size:15px;border-color:transparent;background:none}
.keys button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lockmsg{min-height:22px;font-weight:600;color:#ffb38a !important}
.lockforgot{background:none;border:0;color:#cfd6d0;text-decoration:underline;font-size:14px;cursor:pointer}
code{font-size:13px;background:var(--bg);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}
</style>

const CLIENT_TPL="<title>Livraison<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap\">\n<style>\n/* Layout: road-green hero (name, hours, zones), one form card in numbered sections A→B, sticky-free big WhatsApp button */\n:root{--bg:#f3f1ec;--surface:#fff;--fg:#1d2320;--muted:#5f6862;--line:#d6d2c8;--accent:#d9621b;--accent-ink:#fff;--road:#243b34;--hero-fg:#f3efe6;--hero-sub:#d6dbd4;--wa:#1f8f4e;--ok:#2f7d4f;--err:#b42318;--soft:#f7e6da;\n --display:\"Barlow Condensed\",\"Arial Narrow\",system-ui,sans-serif;--body:\"Barlow\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#131816;--surface:#1c2320;--fg:#ecefe9;--muted:#9aa39d;--line:#2e3833;--accent:#f07a32;--accent-ink:#1a0e05;--road:#0d1311;--wa:#3fbf73;--ok:#5cc185;--err:#f97066;--soft:#33261d;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#131816;--surface:#1c2320;--fg:#ecefe9;--muted:#9aa39d;--line:#2e3833;--accent:#f07a32;--accent-ink:#1a0e05;--road:#0d1311;--wa:#3fbf73;--ok:#5cc185;--err:#f97066;--soft:#33261d;color-scheme:dark}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45}\nimg{max-width:100%}\n[hidden]{display:none!important}\ninput,textarea,button{font:inherit;color:inherit}\n.hero{background:var(--road);color:var(--hero-fg);padding:18px 16px 36px;position:relative;overflow:hidden}\n.hero::after{content:\"\";position:absolute;left:0;right:0;bottom:12px;height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 44px,transparent 44px 80px)}\n.wrap{max-width:560px;margin:0 auto}\n.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.open{font-size:13px;font-weight:700;border-radius:999px;padding:4px /* read a request message from the client page (or an older/simple one) */
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[*_]/g,"").replace(/^[^a-z]+/,"").trim()}
function parseMsg(txt){
  const out={};
  const keys=[["shop",["boutique"]],["rphone",["tel. destinataire","tel destinataire","telephone destinataire"]],["rname",["destinataire"]],["phone",["telephone","tel","numero"]],["name",["nom","nome"]],
   ["from",["recuperer","retrait","ritiro","prendere"]],["to",["livrer","consegna","portare"]],["what",["quoi","cosa"]],["when",["quand"]],["payer",["livraison payee par","payee par"]],["cod",["a encaisser"]],["pay",["paiement"]],["note",["precisions","note"]]];
  for(const line of String(txt).split(/\r?\n/)){
    if(line.includes("🎤"))out.voice=true;
    const m=line.match(/^\s*([^:：]{2,40}?)\s*[:：]\s*(.*)$/);if(!m)continue;
    const k=norm(m[1]),val=m[2].trim();if(!val)continue;
    for(const [f,ws] of keys){if(out[f]===undefined&&ws.some(w=>k===w||k.startsWith(w+" ")||k.startsWith(w))){out[f]=val;break}}
  }
  const r={};
  if(out.name)r.name=out.name;if(out.phone)r.phone=out.phone;if(out.from)r.from=out.from;if(out.to)r.to=out.to;
  if(out.rname)r.rname=out.rname;if(out.rphone)r.rphone=out.rphone;if(out.note)r.note=out.note;
  if(out.what){const m=out.what.match(/^(.*?)\s*\((Petit|Moyen|Grand)\)\s*$/i);if(m){r.what=m[1];r.size={petit:"S",moyen:"M",grand:"L"}[m[2].toLowerCase()]}else r.what=out.what}
  if(out.when&&!/^maintenant$/i.test(out.when))r.when=out.when;
  if(out.payer){const p=norm(out.payer);r.payer=p.startsWith("destinataire")?"dest":"exp";if(p.includes("wave"))r.method="wave";else if(p.includes("orange"))r.method="om";else if(p.includes("especes"))r.method="cash"}
  if(out.pay){const p=norm(out.pay);if(p.includes("wave"))r.method="wave";else if(p.includes("orange"))r.method="om";else if(p.includes("especes")||p.includes("contant"))r.method="cash"}
  if(out.cod){const n=digits(out.cod);if(n)r.cod=Number(n)}
  if(out.shop){r.shopName=out.shop;if(!r.name)r.name=out.shop}
  if(out.voice)r.note=(r.note?r.note+" · ":"")+"🎤 vocal";
  return r;
}

/* ---------- PIN lock ---------- */
const LOCK_MIN=5;
async function sha(txt){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const ch of txt)h=((h<<5)+h+ch.charCodeAt(0))|0;return "d"+(h>>>0).toString(16)}}
function setPinState(p){const had=S.pin;S.pin=p&&p.h?p:null;if(!S.pin)S.locked=false;else if(had===undefined)S.locked=true;render()}
async function putPin(p){
  S.pin=p;S.locked=false;S.lastAct=Date.now();render();
  if(S.db){try{p?await S.db.doc("impostazioni/pin").set(p):await S.db.doc("impostazioni/pin").delete()}catch(e){toast("Errore / Erreur")}}
  else{try{p?localStorage.setItem("gl_pin",JSON.stringify(p)):localStorage.removeItem("gl_pin")}catch(e){}}
}
function lockNow(){if(!S.pin)return;S.locked=true;S.pinBuf="";S.lockForgot=false;render()}
function paintLock(){
  const box=$("lockbox"),title=esc(bizName()||(typeof CITY!=="undefined"?"Gestione · "+CITY:"Gestione Livraison"));
  if(S.pin===undefined){box.innerHTML=`<div class="lk">🔒</div><h2>${title}</h2><p>${t("lockLoad")}</p>`;return}
  const wait=Math.ceil((S.waitUntil-Date.now())/1000);
  box.innerHTML=`<div class="lk">🔒</div><h2>${title}</h2><p>${t("lockT")}</p>
   <div class="dots" id="dots">${[0,1,2,3].map(i=>`<i class="${i<S.pinBuf.length?"on":""}"></i>`).join("")}</div>
   <p class="lockmsg" id="lockmsg">${wait>0?t("lockWait").replace("{s}",wait):(S.lockMsg||"")}</p>
   <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-key="${n}">${n}</button>`).join("")}<span></span><button type="button" data-key="0">0</button><button type="button" class="fn" data-key="del">${t("keyDel")}</button></div>
   ${S.isOwner?(S.lockForgot?`<p>${t("lockForgotQ")}</p><div class="acts" style="justify-content:center"><button class="btn main" data-lockact="forgotyes">${t("yes").replace(/,.*$/,"")}</button><button class="btn" data-lockact="forgotno">${t("no")}</button></div>`:`<button class="lockforgot" data-lockact="forgot">${t("lockForgot")}</button>`):""}`;
}
async function pressKey(k){
  if(!S.pin||Date.now()<S.waitUntil)return;
  S.lockMsg="";
  if(k==="del")S.pinBuf=S.pinBuf.slice(0,-1);else if(S.pinBuf.length<4)S.pinBuf+=k;
  paintLock();
  if(S.pinBuf.length===4){
    const ok=(await sha(S.pin.s+S.pinBuf))===S.pin.h;
    if(ok){S.locked=false;S.fails=0;S.pinBuf="";S.lastAct=Date.now();$("app").innerHTML="";render();return}
    S.fails++;S.pinBuf="";S.lockMsg=t("lockBad");if(S.fails>=5){S.fails=0;S.waitUntil=Date.now()+30000;setTimeout(()=>{if(S.locked)paintLock()},30500)}
    paintLock();const d=$("dots");if(d){d.classList.remove("bad");void d.offsetWidth;d.classList.add("bad")}
  }
}

setInterval(()=>{if(S.pin&&!S.locked&&Date.now()-S.lastAct>LOCK_MIN*60000)lockNow()},15000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.pin&&!S.locked&&Date.now()-S.lastAct>LOCK_MIN*60000)lockNow()});
$("lock").addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.key!==undefined){pressKey(b.dataset.key);return}

  else if(a==="forgotyes"&&S.isOwner){S.lockForgot=false;await putPin(null);S.tab="sito";$("app").innerHTML="";render()}
});

async function ibCheck(){
  if(IB.busy)return;IB.busy=true;
  try{
    const r=await fetch("https://ntfy.sh/"+CANAL+"/json?poll=1&since=24h");if(!r.ok)throw 0;
    const txt=await r.text();let add=0;
    for(const line of txt.split("\n")){
      if(!line.trim())continue;let m;try{m=JSON.parse(line)}catch(e){continue}
      if(m.event!=="message"||IB.seen.includes(m.id))continue;
      IB.seen.push(m.id);const body=String(m.message||"");if(!body.includes("#LIV"))continue;
      const clean=body.replace(/\n?#LIV\s*$/,"");const p=parseMsg(clean);if(!Object.keys(p).length)continue;
      IB.list.push({id:m.id,time:m.time*1000,p});add++;
    }
    IB.err=false;IB.last=new Date();ibSave();
    if(add)toast("📥 +"+add);
  }catch(e){IB.err=true}
  IB.busy=false;ibTitle();if(S.tab==="oggi"&&!(S.pin&&S.locked)){const el=$("inbox");if(el)el.outerHTML=inboxHTML()}
}

function qrMatrix(text){if(typeof qrcode!=="function")return null;const q=qrcode(0,"M");q.addData(text);q.make();return q}
function qrSVG(text){const q=qrMatrix(text);if(!q)return "";const n=q.getModuleCount();let p="";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n+4} ${n+4}" role="img" aria-label="QR"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><path d="${p}" fill="#1d2320"/></svg>`}

  x.fillStyle="#f3efe6";canvasText(x,title0?"Scannez pour une livraison":"Scannez pour commander",540,1560,960,"700 64px 'Barlow',sans-serif");

  if(b.id==="fab"){S.editing=null;S.prefill=null;go("nuova");return}
  if(b.dataset.filter){S.filter=b.dataset.filter;render();return}
  if(b.dataset.rfilter!==undefined){S.rfilter=b.dataset.rfilter;render();return}
  const sg=b.closest("[data-seg]");
  if(sg){const k=sg.dataset.seg;S.fsel[k]=(k!=="payer"&&k!=="shPayer"&&S.fsel[k]===b.dataset.v)?"":b.dataset.v;sg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",S.fsel[k]===x.dataset.v));return}
  const a=b.dataset.act;if(!a)return;
  const x=S.items.find(i=>i.id===b.dataset.id);
  if(a==="go"&&x)await put({...x,status:"go"});
  else if(a==="done"&&x){await put({...x,status:"done",doneAt:Date.now()});toast(t("done"))}
  else if(a==="paid"&&x)await put({...x,paid:!x.paid,paidAt:!x.paid?Date.now():null});
  else if(a==="codgot"&&x)await put({...x,codState:"got"});
  else if(a==="codback"&&x)await put({...x,codState:"back"});
  else if(a==="edit"&&x){S.editing=x.id;S.prefill=null;S.tab="nuova";$("app").innerHTML="";render();window.scrollTo(0,0)}
  else if(a==="del"){S.confirmDel=b.dataset.id;render()}
  else if(a==="delno"){S.confirmDel=null;render()}
  else if(a==="delyes"){S.confirmDel=null;await remove(b.dataset.id);toast(t("deleted"))}
  else if(a==="cancel")go("oggi");
  else if(a==="parse"){
    const p=parseMsg(g("f-paste"));if(!Object.keys(p).length){toast(t("pasteNo"));return}
    const map={name:"f-name",phone:"f-phone",from:"f-from",to:"f-to",rname:"f-rname",rphone:"f-rphone",what:"f-what",when:"f-when",cod:"f-cod",note:"f-note"};
    for(const k in map)if(p[k]!==undefined&&$(map[k]))$(map[k]).value=p[k];
    for(const k of ["size","payer","method"])if(p[k]){S.fsel[k]=p[k];const sgx=document.querySelector(`[data-seg="${k}"]`);if(sgx)sgx.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",S.fsel[k]===z.dataset.v))}
    const ms=matchShop(p);if(ms&&$("f-shop")){$("f-shop").value=ms.id;if(!p.from&&ms.adr)$("f-from").value=ms.adr}
    toast(t("pasteOk"));$("f-price").focus()}
  else if(a==="again"){const c=clients()[+b.dataset.i];S.editing=null;S.tab="nuova";S.prefill={name:c.name,phone:c.phone,from:c.from};$("app").innerHTML="";render();window.scrollTo(0,0)}
  else if(a==="redit"){S.editRider=b.dataset.rid;S.confirmRider=null;$("app").innerHTML="";render();window.scrollTo(0,0)}
  else if(a==="rcancel"){S.editRider=null;$("app").innerHTML="";render()}
  else if(a==="rdel"){S.confirmRider=b.dataset.rid;render()}
  else if(a==="rdelno"){S.confirmRider=null;render()}
  else if(a==="rdelyes"){const id=b.dataset.rid;S.confirmRider=null;if(S.rfilter===id)S.rfilter="";await removeRider(id);toast(t("deleted"))}
  else if(a==="nedit"){S.editShop=b.dataset.sid;S.confirmShop=null;S.settleShop=null;$("app").innerHTML="";render();window.scrollTo(0,0)}
  else if(a==="ncancel"){S.editShop=null;$("app").innerHTML="";render()}
  else if(a==="ndel"){S.confirmShop=b.dataset.sid;S.settleShop=null;render()}
  else if(a==="ndelno"){S.confirmShop=null;render()}
  else if(a==="ndelyes"){const id=b.dataset.sid;S.confirmShop=null;await removeShop(id);toast(t("deleted"))}
  else if(a==="nsettle"){S.settleShop=b.dataset.sid;S.confirmShop=null;render()}
  else if(a==="nsettleno"){S.settleShop=null;render()}
  else if(a==="nsettleyes"){const id=b.dataset.sid;S.settleShop=null;const now=Date.now();
    for(const x of S.items.filter(i=>i.shop===id)){let y=null;if(!x.paid&&x.payer!=="dest")y={...(y||x),paid:true,paidAt:now};if(+x.cod>0&&x.codState==="got")y={...(y||x),codState:"back"};if(y)await put(y)}
    toast(t("shSettled"))}
  else if(a==="ncopy"){const sh=S.shops.find(s=>s.id===b.dataset.sid);const link=sh?shopLink(sh):"";try{await navigator.clipboard.writeText(link);toast(t("copied"))}catch(e){const el=$("sl-"+b.dataset.sid);if(el){const r=document.createRange();r.selectNodeContents(el);const s2=getSelection();s2.removeAllRanges();s2.addRange(r)}toast(t("copyNo"))}}
  else if(a==="nposter"){const sh=S.shops.find(s=>s.id===b.dataset.sid);if(sh){const bl=await posterPNG(shopLink(sh),sh.name,"LIVRAISON À MOTO",bizName()?"avec "+bizName():"");if(bl)await saveFile("qr-"+sh.name.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".png",bl)}}
  else if(a==="pinlock")lockNow();
  else if(a==="pinremove"){S.pinRemoveAsk=true;$("app").innerHTML="";render()}
  else if(a==="pinremoveno"){S.pinRemoveAsk=false;$("app").innerHTML="";render()}
  else if(a==="pinremoveyes"){S.pinRemoveAsk=false;$("app").innerHTML="";await putPin(null);toast(t("pinRemoved"))}
  else if(a==="dlsite")await saveFile("index.html",buildSite());
  else if(a==="dlprev"){const bl=await previewPNG();if(bl)await saveFile("anteprima.png",bl)}
  else if(a==="dlposter"){const bl=await posterPNG();if(bl)await saveFile("qr-sito.png",bl)}
  else if(a==="copy"){const url=siteURL();try{await navigator.clipboard.writeText(url);toast(t("copied"))}catch(e){const el=$("site-link");if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast(t("copyNo"))}}
});
document.addEventListener("change",async ev=>{
  if(ev.target.id==="f-shop"){const sh=S.shops.find(s=>s.id===ev.target.value);if(sh){$("f-name").value=sh.name;$("f-phone").value=sh.phone||"";if(sh.adr)$("f-from").value=sh.adr;
    S.fsel.payer=sh.payer||"exp";const sg=document.querySelector('[data-seg="payer"]');if(sg)sg.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",S.fsel.payer===z.dataset.v))}return}
  const el=ev.target;if(!el.classList||!el.classList.contains("rsel"))return;
  const x=S.items.find(i=>i.id===el.dataset.id);if(x)await put({...x,rider:el.value});
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="f-name"){const n=ev.target.value.trim().toLowerCase();const last=[...S.items].sort((a,b)=>b.createdAt-a.createdAt).find(x=>String(x.name||"").toLowerCase()===n);
    const ph=$("f-phone");if(last&&ph&&!ph.value)ph.value=last.phone||"";}
});
document.addEventListener("submit",async ev=>{
  ev.preventDefault();const id=ev.target.id;
  if(id==="rf"){
    const name=g("r-name"),phone=g("r-phone");if(!name||digits(phone).length<7){toast(t("rNeed"));return}
    const r={id:S.editRider||uid(),name,phone};S.editRider=null;document.activeElement&&document.activeElement.blur&&document.activeElement.blur();$("app").innerHTML="";
    await putRider(r);toast(t("rSaved"));return}
  if(id==="pf"){
    const a1=g("p1"),a2=g("p2");if(!/^\d{4}$/.test(a1)||a1!==a2){toast(t("pinBad"));return}
    const salt=uid();const h=await sha(salt+a1);document.activeElement&&document.activeElement.blur&&document.activeElement.blur();$("app").innerHTML="";
    await putPin({s:salt,h});toast(t("pinSaved"));return}
  if(id==="nf"){
    const name=g("n-name"),phone=g("n-phone");if(!name||digits(phone).length<7){toast(t("shNeed"));return}
    const old=S.editShop?S.shops.find(x=>x.id===S.editShop):null;
    const r={...(old||{}),id:S.editShop||uid(),name,phone,adr:g("n-adr"),payer:S.fsel.shPayer||"exp"};S.editShop=null;S.fsel.shPayer="exp";
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();$("app").innerHTML="";await putShop(r);toast(t("shSaved"));return}
  if(id==="sf"){
    const c={...(S.cfg||{}),name:g("s-name"),whatsapp:g("s-wa"),slogan:g("s-slogan"),open:g("s-open"),close:g("s-close"),days:g("s-days"),zones:g("s-zones"),priceFrom:Number(g("s-price"))||0,
      pay:{cash:$("s-cash").checked,wave:$("s-wave").checked,om:$("s-om").checked},payNumber:g("s-paynum"),cod:$("s-cod").checked,siteUrl:g("s-url"),logo:$("s-logo").checked?"logo.png":"",sheet:g("s-sheet")};
    if(!c.name||digits(c.whatsapp).length<7){toast(t("sNeed"));return}
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();$("app").innerHTML="";
    await putCfg(c);toast(t("sSaved"));return}
  if(id!=="f")return;
  const name=g("f-name"),price=g("f-price");if(!name||price===""){toast(t("need"));return}
  const old=S.editing?S.items.find(x=>x.id===S.editing):null,paid=$("f-paid").checked;
  const item={...(old||{status:"pick",createdAt:Date.now()}),id:old?old.id:uid(),name,phone:g("f-phone"),from:g("f-from"),to:g("f-to"),rname:g("f-rname"),rphone:g("f-rphone"),
    what:g("f-what"),when:g("f-when"),size:S.fsel.size||"",payer:S.fsel.payer||"exp",method:S.fsel.method||"",cod:Number(g("f-cod"))||0,note:g("f-note"),
    price:Number(price)||0,shop:$("f-shop")?$("f-shop").value:(old?old.shop||"":""),rider:$("f-rider")?$("f-rider").value:(old?old.rider||"":""),paid,paidAt:paid?(old&&old.paid?old.paidAt:Date.now()):null};
  if(!item.cod)item.codState="";
  S.editing=null;S.prefill=null;S.tab="oggi";S.filter="todo";$("app").innerHTML="";
  if(S.fromInbox&&!old){ibRemove(S.fromInbox);S.fromInbox=null}
  await put(item);toast(t("saved"));window.scrollTo(0,0);
});
render();
</script>

</body></html>
